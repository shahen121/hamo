<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جين ومحمد - احتفال ملكي</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=El+Messiri:wght@400;700&family=Montserrat:wght@100;300;400&display=swap');

        :root {
            --bg-color: #050505;
            --primary-gold: #d4af37;
            --soft-gold: #f1e5ac;
            --glow-color: rgba(212, 175, 55, 0.4);
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            font-family: 'Montserrat', 'Cairo', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--white);
            touch-action: none;
        }

        /* خلفية المعالم بتأثير العمق */
        .germany-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .landmark-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(15px) brightness(0.2);
            -webkit-filter: blur(15px) brightness(0.2);
            opacity: 0;
            transition: opacity 3s ease;
        }

        .landmark-img.active {
            opacity: 0.25;
        }

        /* محرك الجسيمات */
        #nebula-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .hero-section {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 500px;
            perspective: 1500px;
        }

        /* إطار التصميم الملكي */
        .signature-frame {
            position: relative;
            padding: 60px 20px;
            background: rgba(10, 10, 10, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform-style: preserve-3d;
            will-change: transform;
        }

        .light-sweep {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(212, 175, 55, 0.05), transparent 40%);
            animation: rotateSweep 12s infinite linear;
            pointer-events: none;
        }

        @keyframes rotateSweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .top-label {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 10px;
            color: var(--primary-gold);
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .names-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin: 15px 0;
        }

        .name-part {
            font-family: 'El Messiri', sans-serif;
            font-size: clamp(3.5rem, 15vw, 6rem);
            line-height: 1.1;
            margin: 0;
            font-weight: 700;
            background: linear-gradient(180deg, var(--soft-gold), var(--primary-gold));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: var(--primary-gold); /* Fallback */
        }

        .ampersand {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            opacity: 0.3;
            margin: 5px 0;
        }

        .celebration-msg {
            font-weight: 300;
            font-size: 1rem;
            letter-spacing: 4px;
            margin-top: 30px;
            opacity: 0.6;
            text-transform: uppercase;
        }

        .master-btn {
            background: transparent;
            border: 1px solid var(--primary-gold);
            color: var(--primary-gold);
            padding: 15px 40px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            margin-top: 40px;
            letter-spacing: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .master-btn:active {
            background: var(--primary-gold);
            color: #000;
            transform: scale(0.95);
        }

        .touch-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: none; /* يتم تفعيله عند اللمس */
        }

        @media (pointer: fine) {
            .touch-glow { display: block; }
        }
    </style>
</head>
<body ontouchmove="handleInteraction(event)" onmousemove="handleInteraction(event)" onclick="handleGlobalClick(event)">

    <div class="germany-background">
        <img src="https://tse4.mm.bing.net/th/id/OIP.xtb0ARKZe2y097qGwJMLaAHaEK?rs=1&pid=ImgDetMain&o=7&rm=3" class="landmark-img active" alt="">
        <img src="https://www.theinvisibletourist.com/wp-content/uploads/2019/12/the-central-square-of-Munich-640x426.jpg" class="landmark-img" alt="">
        <img src="https://tse3.mm.bing.net/th/id/OIP.k6cxsa2E23wbYYK0y3WvjAHaE8?w=900&h=600&rs=1&pid=ImgDetMain&o=7&rm=3" class="landmark-img" alt="">
    </div>

    <canvas id="nebula-canvas"></canvas>
    <div id="touch-glow" class="touch-glow"></div>

    <div class="hero-section">
        <div class="signature-frame" id="mainFrame">
            <div class="light-sweep"></div>
            <div class="top-label">Sacred Union</div>
            
            <div class="names-container">
                <h1 class="name-part">جين</h1>
                <div class="ampersand">&</div>
                <h1 class="name-part">محمد</h1>
            </div>

            <p class="celebration-msg">ألف مبروك</p>
            
            <button class="master-btn" id="mainBtn">Celebrate</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('nebula-canvas');
        const ctx = canvas.getContext('2d');
        const frame = document.getElementById('mainFrame');
        const glow = document.getElementById('touch-glow');
        const images = document.querySelectorAll('.landmark-img');
        
        let currentImgIndex = 0;
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', initCanvas);
        initCanvas();

        // تدوير الصور في الخلفية
        setInterval(() => {
            images[currentImgIndex].classList.remove('active');
            currentImgIndex = (currentImgIndex + 1) % images.length;
            images[currentImgIndex].classList.add('active');
        }, 6000);

        function handleInteraction(e) {
            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            
            if (glow) {
                glow.style.left = clientX + 'px';
                glow.style.top = clientY + 'px';
            }

            // حركة 3D خفيفة جداً لتناسب أداء الهواتف
            const rotateX = (window.innerHeight / 2 - clientY) / 40;
            const rotateY = (clientX - window.innerWidth / 2) / 40;
            frame.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            
            if(Math.random() > 0.9) createSpark(clientX, clientY);
        }

        function createSpark(x, y) {
            if (particles.length > 30) particles.shift(); // تقليل عدد الجسيمات للجوال
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 3,
                vy: (Math.random() - 0.5) * 3,
                size: Math.random() * 2,
                life: 1
            });
        }

        function handleGlobalClick(e) {
            const x = e.clientX || (e.touches ? e.touches[0].clientX : window.innerWidth/2);
            const y = e.clientY || (e.touches ? e.touches[0].clientY : window.innerHeight/2);
            
            confetti({
                particleCount: 30,
                spread: 50,
                origin: { x: x/window.innerWidth, y: y/window.innerHeight },
                colors: ['#d4af37', '#ffffff']
            });
        }

        document.getElementById('mainBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 },
                colors: ['#d4af37', '#ffffff']
            });
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(212, 175, 55, ${p.life})`;
                ctx.fill();
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
